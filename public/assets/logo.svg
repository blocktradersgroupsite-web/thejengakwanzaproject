<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Base block / foundation -->
    <rect x="0" y="52" width="80" height="26" rx="4" fill="url(#gradBrand)" />
    <!-- Middle building blocks -->
    <rect x="12" y="28" width="26" height="20" rx="3" fill="url(#gradBrand)" opacity="0.9" />
    <rect x="42" y="28" width="26" height="20" rx="3" fill="url(#gradBrand)" opacity="0.9" />
    <!-- Top apex block -->
    <polygon points="40,2 18,24 62,24" fill="url(#gradGold)" />
    <!-- Letter J & K subtle emblem -->
    <path d="M 32 58 L 44 58 M 38 58 L 38 70 A 4 4 0 0 1 30 70" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Brand Typography -->
  <text x="104" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" fill="#0f172a" letter-spacing="1">
    JENGA<tspan fill="#0d9488">KWANZA</tspan>
  </text>
  
  <text x="105" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#64748b" letter-spacing="2">
    BUSINESS MANAGEMENT SYSTEM
  </text>
  
  <text x="105" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#0369a1">
    ARUSHA, TANZANIA • P.O.BOX 14991
  </text>
</svg>
